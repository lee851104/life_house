[project]
name = "life-house"
version = "0.1.0"
description = "Taoyuan road-safety index for homes and motorcycle routes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "numpy>=2.0",
  "osmium>=4.0",
  "pyproj>=3.6",
  "pyyaml>=6.0",
  "scipy>=1.14",
  "shapely>=2.0",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
